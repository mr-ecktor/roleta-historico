# Roda o coletor na nuvem do GitHub a cada 30 minutos e salva os dados novos no repositório.
name: Coletar roletas

on:
  schedule:
    # Minutos "quebrados" (7 e 37): o GitHub costuma descartar agendamentos nos minutos 0 e 30, os mais disputados
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar coletor
        run: python coletor.py

      - name: Salvar dados novos
        run: |
          git config user.name "coletor-bot"
          git config user.email "coletor-bot@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nenhuma rodada nova."
          else
            git commit -m "Dados: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
