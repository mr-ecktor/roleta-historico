# Roda o coletor na nuvem do GitHub e salva os dados novos no repositório.
# Quem dispara a cada 30 minutos é o cron-job.org (via API), porque o agendador
# do próprio GitHub não estava executando neste repositório.
name: Coletar roletas

on:
  workflow_dispatch: {}   # disparado pelo cron-job.org ou pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install websockets

      - name: Executar coletor
        run: python coletor.py

      # Salva o que foi coletado mesmo se alguma mesa deu problema (o alerta vem da etapa anterior)
      - name: Salvar dados novos
        if: always()
        run: |
          git config user.name "coletor-bot"
          git config user.email "coletor-bot@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nenhuma rodada nova."
          else
            git commit -m "Dados: $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
